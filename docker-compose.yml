version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# ComplianceOS — Docker Compose
# Owner: Member 3 (technical integrator)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Shared infrastructure (Member 3 owns) ──────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: complianceos
      POSTGRES_PASSWORD: complianceos
      POSTGRES_DB: complianceos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complianceos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9002"
    environment:
      MINIO_ROOT_USER: complianceos
      MINIO_ROOT_PASSWORD: complianceos123
    ports:
      - "9000:9000"
      - "9002:9002"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Connector Service (Member 6 owns) ─────────────────────────────────────

  connector-service:
    build:
      context: ./connector-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./backend/demo-data:/repo/backend/demo-data:ro
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Core API (Member 3 owns) ───────────────────────────────────────────────

  core-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://complianceos:complianceos@postgres:5432/complianceos
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      CONNECTOR_API_BASE_URL: http://connector-service:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      connector-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
